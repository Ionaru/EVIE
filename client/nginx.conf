# The scheme the *outermost* proxy saw. This container is only ever reached over
# plain HTTP on the "edge" network, so $scheme is always "http" here and would
# overwrite the "https" the reverse proxy set. That matters more than it looks:
# express-session is configured with proxy:true, so it reads X-Forwarded-Proto
# directly to decide whether it is allowed to send a Secure cookie. Get it wrong
# and it silently declines to set one, so every request lands on a brand new
# session and nothing that depends on session state works.
#
# Fall back to $scheme when the header is absent, so a directly-exposed container
# still behaves sensibly.
map $http_x_forwarded_proto $evie_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    server_name _;
    listen 80 default_server;
    error_log  /var/log/nginx/evie-client-error.log;
    access_log /var/log/nginx/evie-client-access.log;

    root /app;

    location / {
        index index.html;
        try_files $uri $uri/index.html /index.html;
    }

    location /api {
        include /etc/nginx/conf.d/proxy/nginx-proxy.conf;
    }

    location /sso {
        include /etc/nginx/conf.d/proxy/nginx-proxy.conf;
    }

    location /data {
        include /etc/nginx/conf.d/proxy/nginx-proxy.conf;
    }

    location /socket.io {
        include /etc/nginx/conf.d/proxy/nginx-proxy.conf;
    }
}
