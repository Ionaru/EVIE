version: 2

updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns:
          - "@ionaru/eslint-config"
          - "@typescript-eslint/*"
          - "eslint"
          - "eslint-plugin-*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
